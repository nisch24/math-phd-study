# =============================================================================
# JHU PhD Applied Mathematics & Statistics — Self-Study Framework
# Jekyll Configuration for GitHub Pages
# =============================================================================

title: "JHU Applied Math & Stats PhD — Self-Study Guide"
description: >-
  A self-study framework modeled on the Johns Hopkins University
  PhD in Applied Mathematics and Statistics: a foundations bridge,
  core graduate coursework, differential equations and numerical
  analysis, computing skills, and qualifying exam preparation.

baseurl: "/math-phd-study"
url: ""

# Theme (GitHub Pages compatible)
remote_theme: just-the-docs/just-the-docs@v0.10.0

# Search
search_enabled: true
search.button: true

# Heading anchors (clickable § links on headings)
heading_anchors: true

# Back to top link
back_to_top: true
back_to_top_text: "↑ Back to top"

# Auxiliary links (top-right of site)
aux_links:
  "View on GitHub": "https://github.com/nisch24/math-phd-study"
aux_links_new_tab: true

# Footer
footer_content: >-
  <em>This resource is not affiliated with Johns Hopkins University.
  It is an independent study guide based on publicly available course
  descriptions and standard graduate-level textbooks.</em>

# Callouts — kramdown does not render GitHub-style "> [!NOTE]" alerts, so pages
# use just-the-docs callouts instead:  {: .important }  on the line before a > blockquote.
callouts_level: quiet
callouts:
  important:
    title: Important
    color: blue
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Navigation
nav_sort: case_insensitive

# Markdown rendering
markdown: kramdown
kramdown:
  math_engine: mathjax
  input: GFM

# Plugins (must include remote-theme for GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme

# Build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - LICENSE
  - "*.gemspec"
